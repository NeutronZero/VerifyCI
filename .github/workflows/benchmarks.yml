name: benchmarks

on:
  push:
    branches: [main, "benchmarks/*"]
  workflow_dispatch:
    inputs:
      pinned_env:
        description: "Enforce hard hardware pinned timing gate (1=true, 0=false)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  run-benchmarks:
    runs-on: ${{ matrix.os }}
    env:
      VERIFYCI_PINNED_BENCHMARK_ENV: ${{ github.event.inputs.pinned_env || '0' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - name: Run v2 Capability Smoke & Corpus Adjudication
        run: |
          uv run --no-sync python -m verifyci_v2.interface.cli adjudicate --corpus
      - name: Execute Canonical Evidence Adjudication (CAP-009 through CAP-013)
        run: uv run --no-sync python scripts/adjudicate_cap.py
      - name: Execute Performance Evidence Adjudication
        run: uv run --no-sync python scripts/adjudicate_performance_evidence.py
      - name: Run v2 Test Suite
        run: uv run --no-sync python -m pytest tests/v2/ -v
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: |
            benchmark-results-${{ matrix.os }}.json
            evidence/cap-adjudication-bundle.json
