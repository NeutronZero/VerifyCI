name: benchmarks

on:
  push:
    branches: [main, "benchmarks/*"]
  workflow_dispatch:
    inputs:
      pinned_env:
        description: "Enforce hard hardware pinned timing gate (1=true, 0=false)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  run-benchmarks:
    runs-on: ${{ matrix.os }}
    env:
      VERIFYCI_PINNED_BENCHMARK_ENV: ${{ github.event.inputs.pinned_env || '0' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - name: Configure Windows Defender Exclusions
        if: runner.os == 'Windows'
        run: |
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
            Add-MpPreference -ExclusionPath $env:RUNNER_TEMP, $env:LOCALAPPDATA\Temp, $pwd.Path -ErrorAction SilentlyContinue
          } catch {
            Write-Host "Defender preference adjustment skipped: $_"
          }
        shell: powershell
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Set test cache directory
        run: echo "VERIFYCI_TEST_CACHE_DIR=${{ runner.temp }}/verifyci_cache" >> $GITHUB_ENV
        shell: bash
      - name: Cache Benchmark Corpora Repositories
        uses: actions/cache@1bd1e32413824ab0f38a58424e396fe4a85c51fd # v4.2.0
        with:
          path: ${{ runner.temp }}/verifyci_cache
          key: benchmark-repos-${{ runner.os }}-${{ hashFiles('corpora/**') }}
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - name: Run v3 Benchmark Integrity & Performance Protocol
        run: |
          uv run --no-sync python -m pytest tests/v3/test_benchmark_integrity.py tests/v3/test_performance_protocol.py -v
      - name: Run v3 Capability Benchmarks
        run: |
          uv run --no-sync python -m pytest tests/v3/test_contract_benchmark.py tests/v3/test_deletion_benchmark.py tests/v3/test_security_benchmark.py tests/v3/test_semantic_benchmark.py -v
      - name: Upload Benchmark Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results-${{ matrix.os }}
          path: |
            benchmarks/performance/results.json
          if-no-files-found: ignore
