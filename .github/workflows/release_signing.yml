name: Release Signing Authority

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
        description: "Authoritative candidate commit SHA to verify and sign"
      run_id:
        required: true
        type: string
        description: "GitHub Actions workflow run ID"
      run_attempt:
        required: false
        type: string
        default: "1"
        description: "GitHub Actions workflow run attempt"
    secrets:
      VERIFYCI_RELEASE_SIGNING_KEY:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  release-signing:
    name: Authoritative Release Signer
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout Candidate Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Isolated Python Runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Pure Cryptography Only (Isolated Environment)
        # Security Boundary (§15.10):
        # DO NOT run uv sync or install candidate dependencies from uv.lock/pyproject.toml.
        # Only cryptography is installed; repo packages are strictly purged from sys.path.
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir "cryptography>=44.0.0"

      - name: Download Release Measurements Artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: release-measurements
          path: evidence/release

      - name: Ensure Measurements & Attestation File Paths
        run: |
          if [ ! -f evidence/release/measurements.json ]; then
            find evidence/release -name measurements.json -exec cp {} evidence/release/measurements.json \;
          fi
          if [ ! -f evidence/release/measurement_attestation.json ]; then
            find evidence/release -name measurement_attestation.json -exec cp {} evidence/release/measurement_attestation.json \;
          fi
          test -f evidence/release/measurements.json
          test -f evidence/release/measurement_attestation.json

      - name: Verify Standalone Signer Integrity
        run: |
          echo "f09d00ebcf614cc1c7450f74abd00de63109ea9bc079ca71c511517669233f97  scripts/standalone_signer.py" | sha256sum -c -

      - name: Run Authoritative Release Signing (Protected Authority)
        env:
          VERIFYCI_RELEASE_SIGNING_KEY: ${{ secrets.VERIFYCI_RELEASE_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ inputs.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          GITHUB_SHA: ${{ inputs.commit_sha }}
        run: |
          python scripts/standalone_signer.py

      - name: Standalone Cryptographic Verification of Release Validation Evidence
        run: |
          python -c '
          import json
          from cryptography.hazmat.primitives.asymmetric import ed25519
          from pathlib import Path

          p = Path("evidence/release/release_validation.json")
          assert p.is_file(), "release_validation.json missing"
          data = json.loads(p.read_text(encoding="utf-8"))
          schema = data.get("schema")
          assert schema == "verifyci.release_validation/v1", f"schema mismatch: {schema}"
          status = data.get("status")
          assert status == "VALIDATED", f"status not VALIDATED: {status}"
          stage = data.get("stage")
          assert stage == "final", f"stage not final: {stage}"

          prov = data.get("provenance", {})
          assert prov.get("ci_verified") is True, "ci_verified is not True"
          platform = prov.get("ci_platform")
          assert platform == "github_actions", f"ci_platform mismatch: {platform}"
          assert prov.get("oidc_verified") is True, "oidc_verified is not True"
          assert str(prov.get("workflow_run_id")) == "${{ inputs.run_id }}", "workflow_run_id mismatch"
          assert str(prov.get("commit_sha", "")).lower() == "${{ inputs.commit_sha }}".lower(), "commit_sha mismatch"

          att = data.get("attestation", {})
          pub_hex = att.get("public_key")
          sig_hex = att.get("signature")
          digest = att.get("digest")
          assert pub_hex and sig_hex and digest, "missing attestation cryptographic fields"
          pub = ed25519.Ed25519PublicKey.from_public_bytes(bytes.fromhex(pub_hex))
          pub.verify(bytes.fromhex(sig_hex), digest.encode("utf-8"))
          print("SUCCESS: Authoritative release validation cryptographically verified standalone!")
          '

      - name: Upload Evidence Bundle & Release Attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-bundle
          path: |
            evidence/release/release_validation.json
            evidence/release/measurements.json
            evidence/release/measurement_attestation.json
