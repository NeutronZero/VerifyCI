name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # STEP 1: VALIDATE RELEASE (full suite, lint, packaging, smoke tests)
  # ------------------------------------------------------------------
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Run Release Validation Suite
        run: uv run --no-sync python scripts/validate_release.py

  # ------------------------------------------------------------------
  # STEP 2: BUILD DISTRIBUTION PACKAGES (sdist + wheel)
  # ------------------------------------------------------------------
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Build distribution packages
        run: uv build
      - name: Upload distribution packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------
  # STEP 3: CREATE GITHUB RELEASE WITH ARTIFACTS
  # ------------------------------------------------------------------
  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download distribution packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: packages
          path: dist
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          cd dist
          sha256sum *.tar.gz *.whl > SHA256SUMS.txt
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; uploading assets..."
            gh release upload "$TAG_NAME" *.tar.gz *.whl SHA256SUMS.txt --clobber
          else
            echo "Creating release $TAG_NAME..."
            gh release create "$TAG_NAME" *.tar.gz *.whl SHA256SUMS.txt \
              --title "VerifyCI $TAG_NAME" \
              --generate-notes \
              --draft=false \
              --prerelease=false
          fi

  # ------------------------------------------------------------------
  # STEP 4: OIDC TRUSTED PUBLISHING TO PYPI
  # ------------------------------------------------------------------
  publish-pypi:
    needs: [build, create-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/verifyci
    permissions:
      id-token: write # Mandatory for OIDC trusted publishing
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: packages
          path: dist
      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
