name: Trusted Release Measurements

# Trusted measurement entrypoint. This file is authoritative only when executed
# from the protected `release-authority` branch (or an immutable commit on it).
# It is invoked by candidate CI through a full-SHA reference and receives no
# secrets. Candidate code is executed only in this unprivileged job.
on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
        description: "Full 40-character candidate commit SHA to measure"

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  verifyci-measurements:
    name: verifyci-measurements
    runs-on: ubuntu-latest
    steps:
      - name: Validate Candidate Commit Input
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          case "$CANDIDATE_SHA" in
            (*[!0-9a-f]*|"") echo "invalid candidate SHA: $CANDIDATE_SHA" >&2; exit 1 ;;
          esac
          test "${#CANDIDATE_SHA}" -eq 40
          test "$CANDIDATE_SHA" = "$GITHUB_SHA"

      - name: Checkout Candidate Source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: false

      - name: Install Candidate Dependencies (Unprivileged)
        # Candidate dependency installation is confined to this no-secret job.
        run: |
          set -euo pipefail
          test -z "${VERIFYCI_RELEASE_SIGNING_KEY:-}"
          uv sync --frozen --extra dev

      - name: Verify Trusted Measurement Harness Integrity
        # The hash is authoritative only when this workflow file is loaded from
        # the protected release-authority ref. A candidate cannot change it.
        run: |
          set -euo pipefail
          echo "9ff48885661e344472b36642cdecf1774c88df3c990c2df39b5c0f378c96bddf  scripts/validate_release.py" | sha256sum -c -

      - name: Run Trusted Measurement Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -z "${VERIFYCI_RELEASE_SIGNING_KEY:-}"
          uv run --no-sync python scripts/validate_release.py --measure-only

      - name: Upload Release Measurements Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-measurements
          path: |
            evidence/release/measurements.json
            evidence/release/measurement_attestation.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
