name: ci

on:
  push:
    branches: [main, "feat/*", "benchmarks/*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # LINT (single run, all events)
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync ruff check .
      - name: Validate packaging build
        run: uv build

  # ------------------------------------------------------------------
  # TIER 1: PR FAST GATE (< 30s target, runs on every pull request)
  # ------------------------------------------------------------------
  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Select Changed & Critical Tests
        run: |
          uv run --no-sync python scripts/ci_test_selector.py origin/main > selected-tests.txt
          python - <<'PY'
          import re
          from pathlib import Path

          file_re = re.compile(r"[A-Za-z0-9_./-]+\.py")
          dir_re = re.compile(r"tests/(?:[A-Za-z0-9_.-]+/)*")
          targets = Path("selected-tests.txt").read_text(encoding="utf-8").splitlines()
          if not targets:
              raise SystemExit("no pytest targets selected")
          for target in targets:
              if ".." in Path(target).parts:
                  raise SystemExit(f"unsafe pytest target: {target!r}")
              if target.endswith("/"):
                  if not dir_re.fullmatch(target):
                      raise SystemExit(f"unsafe pytest target: {target!r}")
              elif not file_re.fullmatch(target) or not target.startswith("tests/"):
                  raise SystemExit(f"unsafe pytest target: {target!r}")
          PY
      - name: Run Selected Tests
        run: |
          mapfile -t TARGETS < selected-tests.txt
          uv run --no-sync python -m pytest -n auto -q --junitxml=test-results.xml -- "${TARGETS[@]}"
      - name: Upload PR Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr-test-results
          path: test-results.xml

  # ------------------------------------------------------------------
  # TIER 2: FULL COMPATIBILITY MATRIX (Runs on push to main / dispatch)
  # ------------------------------------------------------------------
  full-matrix:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        exclude:
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --extra dev
      - run: uv run --no-sync python -m pytest tests/ -n auto -q --junitxml=test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml
      - name: Upload Matrix Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results-*.xml

  # ------------------------------------------------------------------
  # TIER 3: VERIFYCI MEASUREMENTS GATE (Unprivileged Benchmark & Tests)
  # ------------------------------------------------------------------
  verifyci-measurements:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: full-matrix
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Run Evidence & Benchmark Reproduction Gate
        run: |
          uv run --no-sync python -m pytest tests/v3/ -n auto -q
      - name: Run Unprivileged Benchmark & Test Measurements Pipeline
        run: |
          uv run --no-sync python scripts/validate_release.py --measure-only
      - name: Upload Release Measurements Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-measurements
          path: |
            evidence/release/measurements.json
            evidence/release/measurement_attestation.json

  # ------------------------------------------------------------------
  # TIER 4: PROTECTED RELEASE SIGNING (Restricted to 'release' environment)
  # ------------------------------------------------------------------
  release-signing:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: verifyci-measurements
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: Download Release Measurements Artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: release-measurements
          path: evidence/release
      - name: Ensure Measurements & Attestation File Paths
        run: |
          if [ ! -f evidence/release/measurements.json ]; then
            find evidence/release -name measurements.json -exec cp {} evidence/release/measurements.json \;
          fi
          if [ ! -f evidence/release/measurement_attestation.json ]; then
            find evidence/release -name measurement_attestation.json -exec cp {} evidence/release/measurement_attestation.json \;
          fi
          test -f evidence/release/measurements.json
          test -f evidence/release/measurement_attestation.json
      - name: Verify Standalone Signer Integrity
        run: |
          echo "1a16647d52f4b1665c98e2b006ba144a9d085948e9021ebbb6a322f4e0703549  scripts/standalone_signer.py" | sha256sum -c -
      - name: Run Authoritative Release Signing (Protected Environment)
        env:
          VERIFYCI_RELEASE_SIGNING_KEY: ${{ secrets.VERIFYCI_RELEASE_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run --no-sync python scripts/standalone_signer.py
      - name: Verify Release Validation Attestation
        run: |
          uv run --no-sync python -c "from verifyci.contracts.release_validation import verify_release_validation_evidence; ok, err = verify_release_validation_evidence(); assert ok, f'Attestation verification failed: {err}'; print('Release attestation cryptographically verified!')"
      - name: Generate Evidence Bundle & Summary
        run: |
          uv run --no-sync python scripts/build_evidence_bundle.py
      - name: Upload Evidence Bundle & Release Attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-bundle
          path: |
            evidence/evidence-bundle.json
            evidence/release/release_validation.json
            evidence/release/measurements.json
            evidence/release/measurement_attestation.json

  # ------------------------------------------------------------------
  # SUPPLY-CHAIN AUDIT (advisory, non-blocking)
  # ------------------------------------------------------------------
  supply-chain-audit:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - name: pip-audit (advisory, non-blocking)
        run: uvx pip-audit --desc || true
