name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # TIER 1: PR FAST GATE (< 30s target, runs on every pull request)
  # ------------------------------------------------------------------
  pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check .
      - name: Select Changed & Critical Tests
        run: |
          python scripts/ci_test_selector.py origin/main > selected-tests.txt
          python - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(r"[A-Za-z0-9_./-]+\.py")
          targets = Path("selected-tests.txt").read_text(encoding="utf-8").splitlines()
          if not targets:
              raise SystemExit("no pytest targets selected")
          if any(not pattern.fullmatch(target) or not target.startswith("tests/") for target in targets):
              raise SystemExit("unsafe pytest target emitted by selector")
          PY
      - name: Run Selected Tests
        run: |
          mapfile -t TARGETS < selected-tests.txt
          python -m pytest -n auto -q --junitxml=test-results.xml -- "${TARGETS[@]}"
      - name: Upload PR Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results
          path: test-results.xml

  # ------------------------------------------------------------------
  # TIER 2: FULL COMPATIBILITY MATRIX (Runs on push to main / dispatch)
  # ------------------------------------------------------------------
  full-matrix:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv pip install --system -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest tests/ -n auto -q --junitxml=test-results-${{ matrix.os }}-${{ matrix.python-version }}.xml
      - name: Upload Matrix Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
          path: test-results-*.xml

  # ------------------------------------------------------------------
  # TIER 3: VERIFYCI EVIDENCE GATE (Produces official evidence bundle)
  # ------------------------------------------------------------------
  verifyci-evidence:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: full-matrix
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv pip install --system -e ".[dev]"
      - name: Run Evidence & Benchmark Reproduction Gate
        run: |
          python -m pytest tests/evaluation/ tests/performance/ -q
      - name: Generate Evidence Bundle & Summary
        run: |
          python scripts/build_evidence_bundle.py
      - name: Upload Evidence Bundle
        uses: actions/upload-artifact@v4
        with:
          name: evidence-bundle
          path: evidence/evidence-bundle.json
