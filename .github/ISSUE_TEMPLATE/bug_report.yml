name: Bug Report
description: Report a defect, unexpected verification verdict, or crash with reproducible diff
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in VerifyCI.
        VerifyCI operates on deterministic, fail-closed semantics: uncertainty never silently passes.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Concise description of the unexpected behavior.
      placeholder: E.g., vc gate returns INCONCLUSIVE on a diff that only touches a supported Python file...
    validations:
      required: true
  - type: textarea
    id: reproduction_diff
    attributes:
      label: Minimal Reproducible Diff
      description: Minimal commit range (base..head) or unified diff that reproduces the behavior, plus the .verifyci/policy.toml in force.
      render: diff
    validations:
      required: true
  - type: textarea
    id: command_output
    attributes:
      label: Command & Exit Code / Output
      description: The exact `vc gate` command and its exit code, with `--format json` output (evidence bundle) preferred.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: expected_vs_actual
    attributes:
      label: Observed Verdict vs Expected Verdict
      options:
        - "Observed FAIL, Expected PASS"
        - "Observed PASS, Expected FAIL"
        - "Observed INCONCLUSIVE, Expected PASS"
        - "Observed ERROR (Exit 3)"
        - "Observed REVIEW (Exit 4)"
        - "Linter or Build failure"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, VerifyCI version / commit SHA.
      placeholder: Python 3.12, Ubuntu 22.04, VerifyCI 3.1.10, git 2.45
    validations:
      required: true
