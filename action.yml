name: "VerifyCI Gate"
description: "Deterministic, local-first code verification for agentic pull requests and diffs (v3.1)"
author: "VerifyCI Contributors"

branding:
  icon: "check-shield"
  color: "blue"

inputs:
  path:
    description: "Path to repository or code root"
    required: false
    default: "."
  base-ref:
    description: "Base git ref/commit to diff against (defaults to PR base SHA or HEAD~1)"
    required: false
    default: ""
  head-ref:
    description: "Head git ref/commit to diff (defaults to HEAD)"
    required: false
    default: "HEAD"
  format:
    description: "Output format: sarif, json, or text"
    required: false
    default: "sarif"
  output-file:
    description: "File path to save the verification report"
    required: false
    default: "verifyci-results.sarif"
  as-of:
    description: "UTC calendar date YYYY-MM-DD for deterministic waiver/acceptance evaluation"
    required: false
    default: ""
  review-mode:
    description: "Review clearing mode: default or codeowners"
    required: false
    default: "default"
  cache-mode:
    description: "Cache mode: authenticated, none, or local"
    required: false
    default: "none"
  cache-dir:
    description: "Directory for VerifyCI cache"
    required: false
    default: ""

outputs:
  status:
    description: "Verification verdict: PASS, FAIL, INCONCLUSIVE, ERROR, REVIEW"
    value: ${{ steps.run-verifyci.outputs.status }}
  exit-code:
    description: "VerifyCI CLI exit code (0=PASS, 1=FAIL, 2=INCONCLUSIVE, 3=ERROR, 4=REVIEW)"
    value: ${{ steps.run-verifyci.outputs.exit_code }}
  report-file:
    description: "Path to generated report file"
    value: ${{ inputs.output-file }}

runs:
  using: "composite"
  steps:
    - name: Run VerifyCI Verification Gate
      id: run-verifyci
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_HEAD_REF: ${{ inputs.head-ref }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_AS_OF: ${{ inputs.as-of }}
        INPUT_REVIEW_MODE: ${{ inputs.review-mode }}
        INPUT_CACHE_MODE: ${{ inputs.cache-mode }}
        INPUT_CACHE_DIR: ${{ inputs.cache-dir }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -uo pipefail

        REPO_PATH="${INPUT_PATH-.}"
        BASE_REF="${INPUT_BASE_REF-}"
        HEAD_REF="${INPUT_HEAD_REF-HEAD}"
        FORMAT="${INPUT_FORMAT-sarif}"
        OUT_FILE="${INPUT_OUTPUT_FILE-verifyci-results.sarif}"
        AS_OF="${INPUT_AS_OF-}"
        REVIEW_MODE="${INPUT_REVIEW_MODE-default}"
        CACHE_MODE="${INPUT_CACHE_MODE-none}"
        CACHE_DIR="${INPUT_CACHE_DIR-}"

        fail_infra() {
          echo "::error::VerifyCI action input rejected: $1"
          exit 3
        }

        case "$FORMAT" in
          sarif|json|text) ;;
          *) fail_infra "format must be one of: sarif, json, text." ;;
        esac

        case "$REVIEW_MODE" in
          default|codeowners) ;;
          *) fail_infra "review-mode must be 'default' or 'codeowners'." ;;
        esac

        case "$CACHE_MODE" in
          authenticated|none|local) ;;
          *) fail_infra "cache-mode must be one of: authenticated, none, local." ;;
        esac

        case "$OUT_FILE" in
          ""|/*) fail_infra "output-file must be a non-empty relative path." ;;
          -*|*$'\n'*) fail_infra "output-file must not start with '-' or contain newlines." ;;
        esac
        if [[ ! "$OUT_FILE" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "/$OUT_FILE/" == *"/../"* ]]; then
          fail_infra "output-file contains invalid characters or path traversal."
        fi

        # Infer base revision if omitted
        if [ -z "$BASE_REF" ]; then
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            BASE_REF="origin/$GITHUB_BASE_REF"
          elif git rev-parse --verify -q "HEAD~1" >/dev/null; then
            BASE_REF="HEAD~1"
          else
            fail_infra "Cannot infer base-ref; specify base-ref input."
          fi
        fi

        CMD=(vc gate --repo "$REPO_PATH" --base "$BASE_REF" --head "$HEAD_REF" --format "$FORMAT" --output "$OUT_FILE" --review-mode "$REVIEW_MODE" --cache-mode "$CACHE_MODE")
        if [ -n "$AS_OF" ]; then
          CMD+=(--as-of "$AS_OF")
        fi
        if [ -n "$CACHE_DIR" ]; then
          CMD+=(--cache-dir "$CACHE_DIR")
        fi
        if [ "$CACHE_MODE" = "local" ]; then
          CMD+=(--allow-local-cache)
        fi

        echo "::group::Executing VerifyCI Gate"
        "${CMD[@]}"
        EXIT_CODE=$?
        echo "::endgroup::"

        STATUS="UNKNOWN"
        if [ "$FORMAT" = "json" ] && [ -f "$OUT_FILE" ]; then
          STATUS=$(python -c "import sys, json; d=json.load(open(sys.argv[1], encoding='utf-8')); print(d.get('verdict', {}).get('status', 'UNKNOWN'))" "$OUT_FILE" 2>/dev/null || echo "UNKNOWN")
        elif [ "$FORMAT" = "sarif" ] && [ -f "$OUT_FILE" ]; then
          STATUS=$(python -c "import sys, json; d=json.load(open(sys.argv[1], encoding='utf-8')); inv=d.get('runs', [{}])[0].get('invocations', [{}])[0]; print(inv.get('properties', {}).get('verdict', 'UNKNOWN'))" "$OUT_FILE" 2>/dev/null || echo "UNKNOWN")
        fi

        if [ "$STATUS" = "UNKNOWN" ]; then
          case "$EXIT_CODE" in
            0) STATUS="PASS" ;;
            1) STATUS="FAIL" ;;
            2) STATUS="INCONCLUSIVE" ;;
            3) STATUS="ERROR" ;;
            4) STATUS="REVIEW" ;;
            *) STATUS="UNKNOWN" ;;
          esac
        fi

        STATUS="$(printf '%s' "$STATUS" | tr -cd 'A-Za-z_' | cut -c1-32)"
        [ -z "$STATUS" ] && STATUS="UNKNOWN"

        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### VerifyCI Verification Gate"
            echo ""
            echo "| Field | Value |"
            echo "| :--- | :--- |"
            echo "| **Verdict** | \`$STATUS\` |"
            echo "| **Exit Code** | \`$EXIT_CODE\` |"
            echo "| **Report File** | \`$OUT_FILE\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        case "$EXIT_CODE" in
          0)
            echo "::notice::VerifyCI PASSED: no declared defects found with complete coverage."
            exit 0
            ;;
          1)
            echo "::error::VerifyCI FAILED: blocking defect established with validated evidence."
            exit 1
            ;;
          2)
            echo "::warning::VerifyCI INCONCLUSIVE: analysis incomplete or budget exhausted."
            exit 2
            ;;
          3)
            echo "::error::VerifyCI ERROR: fatal execution fault or invalid configuration."
            exit 3
            ;;
          4)
            echo "::warning::VerifyCI REVIEW: gate-integrity or policy change requires human review."
            exit 4
            ;;
          *)
            echo "::error::VerifyCI returned unexpected exit code $EXIT_CODE"
            exit "$EXIT_CODE"
            ;;
        esac
