embedding_model: nomic-embed-text
local_llm: llama3.1
vector_store: sqlite
scheduler: async
verification:
  on_failure: block
  on_inconclusive: human_review
  on_human_review: block
  require_deterministic_checker: true
vulnerability_check:
  enabled: true
  mode: offline
  cache_path: ./storage/vuln_cache.db
