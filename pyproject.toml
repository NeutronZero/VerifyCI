[project]
name = "verifyci"
version = "2.0.0"
description = "Deterministic, local-first neuro-symbolic code verification engine"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "VerifyCI Contributors" }]
keywords = ["verification", "code-intelligence", "static-analysis", "ast", "sarif", "ci-cd", "deterministic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]
requires-python = ">=3.12"

dependencies = [
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "z3-solver>=4.13.0",
    "duckdb>=1.0.0",
    "cryptography>=42.0.0",
    "wasmtime>=49.0.0",
    "msgspec>=0.22.0",
    "securesystemslib>=1.5.0",
    "blake3>=0.4.1",
    "xxhash>=3.4.1",
    "egglog>=0.4.0",
    "llguidance>=0.7.0",
]

[project.optional-dependencies]
temporal = ["temporalio>=1.0"]
attestation = ["cryptography>=42.0", "securesystemslib>=1.5.0"]
embeddings = ["sentence-transformers>=3.0"]
otel-semconv = ["opentelemetry-semantic-conventions>=0.40b0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.0", "pytest-xdist>=3.5", "ruff>=0.15", "psutil>=5.9.0"]

[project.scripts]
verifyci = "verifyci.interface.cli:main"
vc = "verifyci.interface.cli:main"
vc2 = "verifyci_v2.interface.cli:main"

[project.urls]
Homepage = "https://github.com/NeutronZero/VerifyCI"
Repository = "https://github.com/NeutronZero/VerifyCI"
Documentation = "https://github.com/NeutronZero/VerifyCI/tree/main/docs"
Changelog = "https://github.com/NeutronZero/VerifyCI/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verifyci", "verifyci_v2"]

[tool.hatch.build.targets.sdist]
only-include = ["verifyci_v2", "README.md", "pyproject.toml", "CHANGELOG.md"]

[tool.pytest.ini_options]
addopts = "-n auto -m 'not benchmark and not performance'"
asyncio_mode = "strict"
testpaths = ["tests"]
junit_family = "xunit2"
markers = [
    "invariant: Critical fail-closed safety invariants and contracts (always executed)",
    "evidence: Frozen empirical benchmark reproductions and evidence claims",
    "benchmark: Expensive multi-corpus adjudications and performance benchmarks",
    "unit: Fast isolated unit tests without external state",
    "integration: Multi-component end-to-end integration tests",
    "performance: Regression benchmark tests with latency thresholds",
]
filterwarnings = [
    # Third-party import-time noise: typer re-exports click utilities
    # deprecated in click 8.x. Unfixable in-repo (no repo code involved);
    # matched narrowly by message so genuine DeprecationWarnings still show.
    "ignore:'click\\.utils\\.get_binary_stream' is deprecated:DeprecationWarning",
    "ignore:'click\\.utils\\.get_text_stream' is deprecated:DeprecationWarning",
]

[tool.ruff]
exclude = ["samples/", "benchmarks/patch_real/cap005/base/"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B023"]
# NOTE: Gate enforces error-level Python syntax/import/undefined-variable rules (E4/E7/E9/F)
# plus loop-closure binding safety (B023). Additional audit-surfaced rule sets
# (BLE, S, full B, UP) are tracked for progressive remediation without blocking CI.
