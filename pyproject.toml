[project]
name = "verifyci"
version = "0.1.0"
description = "Deterministic, local-first code verification for agentic pull requests and diffs"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "VerifyCI Contributors" }]
keywords = ["verification", "code-intelligence", "static-analysis", "ast", "sarif", "ci-cd", "deterministic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.13",
    "typer>=0.25",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "rustworkx>=0.17",
    "fastmcp>=4.0",
    "fastapi>=0.141",
    "aiohttp>=3.14",
    "opentelemetry-api>=1.42",
]

[project.optional-dependencies]
temporal = ["temporalio>=1.0"]
attestation = ["cryptography>=42.0"]
embeddings = ["sentence-transformers>=3.0"]
otel-semconv = ["opentelemetry-semantic-conventions>=0.40b0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.0", "pytest-xdist>=3.5", "ruff>=0.15"]

[project.scripts]
verifyci = "verifyci.interface.cli:app"
aci = "verifyci.interface.cli:app"  # legacy alias; same app, both on PATH

[project.urls]
Homepage = "https://github.com/NeutronZero/VerifyCI"
Repository = "https://github.com/NeutronZero/VerifyCI"
Documentation = "https://github.com/NeutronZero/VerifyCI/tree/main/docs"
Changelog = "https://github.com/NeutronZero/VerifyCI/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
junit_family = "xunit2"
markers = [
    "invariant: Critical fail-closed safety invariants and contracts (always executed)",
    "evidence: Frozen empirical benchmark reproductions and evidence claims",
    "unit: Fast isolated unit tests without external state",
    "integration: Multi-component end-to-end integration tests",
    "performance: Regression benchmark tests with latency thresholds",
]
filterwarnings = [
    # Third-party import-time noise: typer re-exports click utilities
    # deprecated in click 8.x. Unfixable in-repo (no repo code involved);
    # matched narrowly by message so genuine DeprecationWarnings still show.
    "ignore:'click\\.utils\\.get_binary_stream' is deprecated:DeprecationWarning",
    "ignore:'click\\.utils\\.get_text_stream' is deprecated:DeprecationWarning",
]

[tool.ruff]
exclude = ["samples/", "benchmarks/patch_real/cap005/base/"]

[tool.ruff.lint]
select = ["E", "F", "BLE", "S", "B", "UP"]
# NOTE: expanded from the prior narrow gate (E4/E7/E9/F). The old gate
# was effectively near-no-op because ~70 blind-exception sites use
# # noqa: BLE001/S110, which never fired under the narrow select. This
# configuration now surfaces the real categories the audit called out.
# Blanket removal of every new violation in one PR is out of scope: fix
# the highest-risk sites first (BL001 blind Exception, S110 bare except,
# B904/B905 logging of untrusted data) and leave mechanical style rules
# (UP045 Optional->X|None, etc.) for follow-ups or a separate lint
# normalization PR. Individual sites can still use targeted noqas with a
# documented justification; do not reintroduce broad no-op suppression.
