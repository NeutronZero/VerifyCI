[project]
name = "verifyci"
version = "0.1.0"
description = "Verification-first agentic code intelligence platform"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.13",
    "typer>=0.25",
    "pyyaml>=6.0.3",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
    "tree-sitter-c>=0.24",
    "tree-sitter-cpp>=0.23",
    "rustworkx>=0.17",
    "fastmcp>=4.0",
    "fastapi>=0.141",
    "aiohttp>=3.14",
    "opentelemetry-api>=1.42",
]

[project.optional-dependencies]
temporal = ["temporalio>=1.0"]
attestation = ["cryptography>=42.0"]
embeddings = ["sentence-transformers>=3.0"]
otel-semconv = ["opentelemetry-semantic-conventions>=0.40b0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=4.0", "ruff>=0.15"]

[project.scripts]
aci = "verifyci.interface.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
exclude = ["samples/"]
